{% extends 'base.html' %}

{% block content %}

<a href="/create" class="btn btn-primary mb-3">
    Create Incident
</a>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Severity</th>
        <th>Status</th>
    </tr>

    {% for incident in incidents %}

    <tr>
        <td>{{ incident.id }}</td>
        <td>{{ incident.title }}</td>
        <td>{{ incident.severity }}</td>
        <td>{{ incident.status }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
